name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Determine Release Tag
        id: tag_version
        run: |
          DATE_TAG="v3.2.1"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android-app
        env:
          APP_VERSION_NAME: "3.2.1"
        run: ./gradlew assembleRelease -PappVersionName=3.2.1 --no-daemon

      - name: Prepare APK Assets
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk android-app/app/build/outputs/apk/release/update-latest.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: BookReader v3.2.1 (Stable)
          prerelease: false
          body: |
            ### BookReader v3.2.1 (Stable) 📖✨

            **BookReader v3.2.1** fixes the About screen icon crash, brings the circular 3D icon to the About page, and updates the standard squircle launcher icon with high-contrast terracotta claymorphic styling!

            #### Key Updates in this release:
            - **About Screen Crash Fix & Circular 3D Icon**:
              - Fixed `IllegalArgumentException` in `AboutScreen` caused by `painterResource` encountering an adaptive-icon XML.
              - Integrated dedicated rasterized `ic_app_icon_round.webp` in `res/drawable/` ensuring safe loading and authentic circular 3D depth in the About hero card.
            - **Square/Squircle Launcher Asset (`ic_launcher.webp`)**:
              - Upgraded all density buckets (`mdpi`, `hdpi`, `xhdpi`, `xxhdpi`, `xxxhdpi`) to the 3D terracotta cushion container with centered ivory book+equalizer disc.
              - Verified drop shadow integrity with zero light halos over dark and light home screens.

            **NovelArrow Reader v3.2.0** is a comprehensive UX overhaul: dedicated settings routes, voice engine & selection screens, audio studio library with granular MP3 generation progress, smarter web downloads, and branding refinements.

            #### Key Updates in this release:

            - **Settings Architecture Overhaul (M1)**:
              - Deconstructed monolithic settings dialogs into dedicated navigation routes.
              - **Pronunciation Rules Screen**: dedicated route with individual active/inactive toggles, add/edit/delete flows, live test preview, and granular scope filtering (`GLOBAL`, `FOLDER`, `URL_PATTERN`).
              - **Skip Words Screen**: standalone route with responsive `FlowRow` wrapping dialogs.
              - All dialogs and button layouts adapt gracefully to narrow screens without squashing.

            - **Voice Engine & Selection Routes (M2)**:
              - Replaced TTS voice dropdown with a dedicated Voice Engine route.
              - Hierarchical voice picker organized neatly by language and locale.
              - Instant audio preview buttons next to each voice for sampling before selection.

            - **Audio Studio Library & Granular Progress (M3)**:
              - Audio section now defaults to a generated audio file/folder library view.
              - Top-right `+` button opens the Audio Generator workflow.
              - Tapping any audio file plays it immediately through the global persistent bottom media controller.
              - MP3 generation displays real-time granular progress: `Paragraph X / Total` and `Chapter Y / Total`.

            - **Web Multi-Download: Centered Progress & Content Change Detection (M4)**:
              - Centered download progress overlay with dark scrim, chapter counts, and cancel controls.
              - DOM content transition verification: waits for page content to actually change before scraping, preventing duplicate chapter captures.

            - **About Screen & Branding (M5)**:
              - App launcher icon displayed above the "BookReader" title on the About screen.
              - README reframed as a personal hobby project.

            **Download and install `app-release.apk` or `update-latest.apk` below:**
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/release/update-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
