name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Determine Release Tag
        id: tag_version
        run: |
          DATE_TAG="v2.9.0"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android-app
        env:
          APP_VERSION_NAME: "2.9.0"
        run: ./gradlew assembleRelease -PappVersionName=2.9.0 --no-daemon

      - name: Prepare APK Assets
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk android-app/app/build/outputs/apk/release/update-latest.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NovelArrow Reader v2.9.0 (Stable)
          prerelease: false
          body: |
            ### NovelArrow Reader v2.9.0 (Stable) 📖✨

            **NovelArrow Reader v2.9.0** brings **System-Wide and Screen-Off Hardware Volume Button Mapping**, allowing you to control novel TTS playback from outside the app, on the home screen, inside other apps, and when the screen is turned off!

            **100% Free and Open Source Software (FOSS)**

            #### Changes in this release:
            - **System-Wide Hardware Button Interception**:
              - Added `NovelArrowAccessibilityService` with hardware key event filtering capability.
              - Physical Volume Up and Volume Down gestures (Single, Double, and Long Press) are now recognized system-wide across all applications, home screen, and lock screen.
            - **Screen-Off Active Playback Interception**:
              - Enhanced `NovelAudioPlaybackService`'s MediaSession with consistent remote volume provider routing.
              - Volume button gestures seamlessly control TTS playback while walking, running, or listening with the phone locked in your pocket.
            - **Interactive Accessibility Permission Card**:
              - Added a live status card in **Settings ➔ Hardware Buttons** displaying whether the accessibility service is active.
              - Includes a direct one-tap button to open system accessibility settings and automatically updates when returning to the app.
            - **Cross-Channel Deduplication**:
              - Smart timestamp-based debounce prevents duplicate actions between accessibility key events and media session volume adjustments.

            **Download and install `app-release.apk` or `update-latest.apk` below:**
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/release/update-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
