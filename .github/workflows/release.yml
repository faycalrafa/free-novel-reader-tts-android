name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Determine Release Tag
        id: tag_version
        run: |
          DATE_TAG="v2.2.0"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android-app
        env:
          APP_VERSION_NAME: "2.2.0"
        run: ./gradlew assembleRelease -PappVersionName=2.2.0 --no-daemon

      - name: Prepare APK Assets
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk android-app/app/build/outputs/apk/release/update-latest.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NovelArrow Reader v2.2.0 (Stable)
          prerelease: false
          body: |
            ### NovelArrow Reader v2.2.0 (Stable) 📖✨

            **NovelArrow Reader v2.2.0 (Stable)** is a major stable release introducing persistent reinstall backup restoration, a 3-view interactive onboarding slideshow with live permission indicators, full storage access support to preserve reading progress across device reinstalls, and existing hidden config discovery.

            **100% Free and Open Source Software (FOSS)**

            #### Features in this release:
            - **Reinstall Preference & Folder Restoration**: User settings, audio preferences, and loaded folder playlists are safely backed up in hidden files (`.novelreader_preferences.json` and `.novelreader_library.json`) in the `/NovelReader` root and preserved across app updates and reinstalls.
            - **Reading Progress Persistence**: Chapter reading progress (`.progress.json`) in each novel folder is reliably synchronized and automatically restored on reinstall.
            - **Interactive 3-View Onboarding Slideshow**: Clean Material 3 walkthrough explaining app capabilities, background notification controls, and storage protection before app launch.
            - **Live Permission Status Display**: Slideshow views display real-time reactive permission status badges (Granted vs. Required) that update immediately upon returning from OS settings.
            - **Existing Configs Detection & Choice**: Intelligently detects existing backups upon reinstall and prompts the user whether to restore settings and playlists or safely delete all hidden files across loaded folders when starting fresh.
            - **Android 11–16 Storage Permission**: Implemented `MANAGE_EXTERNAL_STORAGE` support and runtime permission handling so external novel folders remain directly accessible without breaking on reinstall.
            - **Monaco Code Editor**: Built-in Monaco Editor with syntax coloring, search, match & replace, and HTML formatting for raw chapter code inspection and editing.
            - **Notification CSS Content Selector**: Foreground notification action allows editing the HTML content selector on the fly without interrupting playback.
            - **Configurable Skip Rules**: Auto-skip headers, footers, and skip words with customizable rule lists and exact-match word boundary toggles.
            - **Permanent Release Signing Keystore**: Consistent official signatures across all builds with pre-install verification to eliminate update incompatibilities.

            **Download and install `app-release.apk` or `update-latest.apk` below:**
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/release/update-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
