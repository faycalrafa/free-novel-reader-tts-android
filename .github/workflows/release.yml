name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Determine Release Tag
        id: tag_version
        run: |
          DATE_TAG="v2.8.0"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android-app
        env:
          APP_VERSION_NAME: "2.8.0"
        run: ./gradlew assembleRelease -PappVersionName=2.8.0 --no-daemon

      - name: Prepare APK Assets
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk android-app/app/build/outputs/apk/release/update-latest.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NovelArrow Reader v2.8.0 (Stable)
          prerelease: false
          body: |
            ### NovelArrow Reader v2.8.0 (Stable) 📖✨

            **NovelArrow Reader v2.8.0** introduces a decluttered **Library Drawer** with contextual long-press reveals, an intuitive **Novel Archiving System**, and a dedicated **Archived Novels Management Area**!

            **100% Free and Open Source Software (FOSS)**

            #### Changes in this release:
            - **Decluttered Library Drawer with Long-Press Action Reveals**:
              - Novel folders and chapter lists now hide action buttons and drag handles by default, providing maximum readability and zero visual clutter.
              - **Long-Press on Novel Folder**: Reveals the **Archive** button and **Delete** button directly inline on that novel.
              - **Long-Press on Chapter**: Reveals the **6-Dots Drag & Drop Handle** on the far left (allowing full drag-to-reorder) and the **Read Status Toggle** and **Delete** buttons on the right.
              - Normal single taps continue to seamlessly select and switch novels/chapters.
            - **Novel Archiving & Storage Safety**:
              - Added an **Archive** action that immediately removes the novel from the active library drawer without deleting downloaded files or reading progress.
            - **Dedicated Archived Novels Management Screen**:
              - Replaced the redundant top header icon in the Library Drawer with a direct **Archive button** (`Icons.Default.Archive`) taking users to the archive management area.
              - Easily view all archived novels, their progress, and chapter counts.
              - **Restore Novels**: Instantly move archived novels back into the active library with preserved reading progress.
              - **View & Manage Archived Chapters**: Inspect individual chapters and selectively delete chapters.
              - **Rename Novels**: Rename archived novel titles with an interactive edit dialog.
              - **Permanent Deletion**: Permanently delete novels or chapters with optional checkbox to clean up storage files.

            **Download and install `app-release.apk` or `update-latest.apk` below:**
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/release/update-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
