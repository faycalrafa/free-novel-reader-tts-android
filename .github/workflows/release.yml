name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Build Release APK
        working-directory: android-app
        run: ./gradlew assembleRelease --no-daemon

      - name: Determine Release Tag
        id: tag_version
        run: |
          DATE_TAG="v1.0.$(date +'%Y%m%d%H%M%S')"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NovelArrow Reader ${{ env.RELEASE_TAG }}
          body: |
            ### NovelArrow Reader Release (${{ env.RELEASE_TAG }}) 📖🚀

            **100% Free and Open Source Software (FOSS)**

            #### Features in this release:
            - Automated Release APK build from branch `${{ github.ref_name }}` (`${{ github.sha }}`).
            - Full offline Text-to-Speech playback with system media controls, lockscreen seekbar sync, and earbud buttons.
            - Multi-keyword Auto Skip Header & Footer filters.
            - Whole-word & substring Auto Skip Words and Pronunciation Correction dictionary.
            - Responsive full-width popup dialogs for settings & content filters.
            - Smart Sleep Timer with automatic reset on playback resumption.

            **Download and install `app-release.apk` below:**
          files: android-app/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
