name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Determine Release Tag
        id: tag_version
        run: |
          DATE_TAG="v2.1.2"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android-app
        env:
          APP_VERSION_NAME: "2.1.2"
        run: ./gradlew assembleRelease -PappVersionName=2.1.2 --no-daemon

      - name: Prepare APK Assets
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk android-app/app/build/outputs/apk/release/update-latest.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NovelArrow Reader v2.1.2 (Unstable)
          prerelease: true
          body: |
            ### NovelArrow Reader v2.1.2 (Unstable) 📖⚡

            **NovelArrow Reader v2.1.2 (Unstable)** integrates a powerful Monaco Code Editor for text chapters and browser inspection with search, match-replace, and beautifying; restricts raw viewing exclusively to text formats; auto-scans `/NovelReader` on first launch; deduplicates TTS settings into the unified control panel; adds on-the-fly notification CSS selector controls; and turns auto-skip header/footer into customizable rule lists.

            **100% Free and Open Source Software (FOSS)**

            #### Features in this release:
            - **Monaco Code Editor for Raw Format**: Built-in WebView Monaco Editor with syntax color coding, HTML formatting/beautifying, Find Search, and Match & Replace for reading or editing chapter source code directly.
            - **Text-Only Raw Format Scope**: Raw editor access is strictly limited to text-based chapters (HTML, TXT, MD, JSON, XML) and hidden for binary formats (PDF, EPUB).
            - **Browser Raw HTML Inspection**: Dedicated Code button in the browser top bar allows instant inspection and beautification of the current webpage's DOM.
            - **First-Launch Default Folder Auto-Scan**: Automatically detects `/NovelReader` (or `novelreader`) download directories on first launch and sets the root library folder without requiring manual configuration.
            - **Consolidated Unified TTS Controls**: Stripped redundant speed, pitch, voice picker, and filter controls from reader and browser dialogs, keeping all audio preferences exclusively in the bottom dock control panel.
            - **Notification CSS Content Selector**: Foreground notification action allows editing the HTML content selector on the fly without leaving audio playback.
            - **Configurable Header & Footer Skip Lists**: Auto-skip headers and footers are now configured as editable rule lists with exact-match word boundary toggles.
            - Automated Unstable Release APK build from branch `${{ github.ref_name }}` (`${{ github.sha }}`).

            **Download and install `app-release.apk` or `update-latest.apk` below:**
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/release/update-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
