name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Determine Release Tag
        id: tag_version
        run: |
          DATE_TAG="v2.7.0"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android-app
        env:
          APP_VERSION_NAME: "2.7.0"
        run: ./gradlew assembleRelease -PappVersionName=2.7.0 --no-daemon

      - name: Prepare APK Assets
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk android-app/app/build/outputs/apk/release/update-latest.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NovelArrow Reader v2.7.0 (Stable)
          prerelease: false
          body: |
            ### NovelArrow Reader v2.7.0 (Stable) 📖✨

            **NovelArrow Reader v2.7.0** introduces customizable **Hardware Button Mapping**, allowing you to control novel TTS playback using your device's physical Volume Up and Volume Down buttons!

            **100% Free and Open Source Software (FOSS)**

            #### Changes in this release:
            - **Hardware Button Mapping (Volume Keys)**:
              - Map physical **Volume Up (+)** and **Volume Down (-)** keys to novel TTS playback controls.
              - Multi-gesture detection: customize **Single Press**, **Double Press** (<320ms), and **Long Press** (>450ms) independently.
              - Supported actions: **Play / Pause**, **Next / Previous Paragraph**, **Next / Previous Chapter**, **Speed Adjustment (±0.1x)**, **Skip 5 Paragraphs**, and **Default Volume Control**.
              - By default, Single Press preserves standard volume adjustments, allowing seamless volume control alongside double-tap and hold gestures.
            - **Screen On & Screen Off Conditions**:
              - Configure hardware button shortcuts to work **Always (Screen On & Off)**, **Only when Screen is OFF** (lock screen / pocket listening), or **Only when Screen is ON** (active app use).
            - **Tactile Vibration Feedback**:
              - Optional subtle haptic vibration click confirms when a shortcut is recognized without needing to look at your screen.
            - **Dedicated Hardware Buttons Settings Screen**:
              - Clean Material 3 interface located under General Settings with burger menu navigation and interactive action pickers.

            **Download and install `app-release.apk` or `update-latest.apk` below:**
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/release/update-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
