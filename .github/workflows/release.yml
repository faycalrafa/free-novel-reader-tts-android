name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Determine Release Tag
        id: tag_version
        run: |
          DATE_TAG="v2.4.0"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android-app
        env:
          APP_VERSION_NAME: "2.4.0"
        run: ./gradlew assembleRelease -PappVersionName=2.4.0 --no-daemon

      - name: Prepare APK Assets
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk android-app/app/build/outputs/apk/release/update-latest.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NovelArrow Reader v2.4.0 (Stable)
          prerelease: false
          body: |
            ### NovelArrow Reader v2.4.0 (Stable) 📖✨

            **NovelArrow Reader v2.4.0 (Stable)** adds a dedicated Global Settings route, a persistent notification quick toolbar with customizable controls, an in-browser native reading mode, a live TTS pause fix, and unified signing keystore consistency.

            **100% Free and Open Source Software (FOSS)**

            #### Features in this release:
            - **Global Settings Hub**: Accessible from the library sidebar footer right above "About App", organizing app-wide preferences and feature routes.
            - **Persistent Notification Quick Toolbar**: Independent ongoing notification themed with app colors that stays pinned even after closing the app. Supports on-the-fly TTS speed cycling, play/pause (instant pickup), chapter navigation, and web site next chapter injection.
            - **Toolbar Customization Options**: Dedicated sub-route in Settings allowing granular toggling of each button on the notification toolbar with a live preview mockup.
            - **In-Browser Native Reading Mode**: Replaces the tabs button with a Reading Mode toggle (`MenuBook` icon) that extracts clean story text (ignoring ads/hyperlinks/buttons), renders it with native reader typography, and auto-advances to the next chapter while keeping the background `WebView` alive in RAM.
            - **Browser Live TTS Pause Fix**: Fixed browser mode pause so that pausing retains all extracted paragraphs, cursor position, and audio state instead of resetting.
            - **Unified Release Keystore**: Configured both debug and release builds with permanent repository release signing and v1/v2 schemes, completely preventing signature mismatch errors between development, CI, and GitHub release installs.

            **Download and install `app-release.apk` or `update-latest.apk` below:**
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/release/update-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
