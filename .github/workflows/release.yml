name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Determine Release Tag
        id: tag_version
        run: |
          DATE_TAG="v2.6.0"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android-app
        env:
          APP_VERSION_NAME: "2.6.0"
        run: ./gradlew assembleRelease -PappVersionName=2.6.0 --no-daemon

      - name: Prepare APK Assets
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk android-app/app/build/outputs/apk/release/update-latest.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NovelArrow Reader v2.6.0 (Stable)
          prerelease: false
          body: |
            ### NovelArrow Reader v2.6.0 (Stable) 📖✨

            **NovelArrow Reader v2.6.0** brings bundled offline Monaco code editing, streamlined toolbar progress, universal library drawer navigation, and clean reading enhancements.

            **100% Free and Open Source Software (FOSS)**

            #### Changes in this release:
            - **Bundled Full Monaco Editor**:
              - Bundled the official VS Code web editor (Monaco Editor 0.45.0) directly into the app assets.
              - 100% offline functionality with zero external CDN dependencies or network latency.
              - Full IDE features: syntax highlighting, brackets matching, find/replace, multi-cursor, and code formatting for JavaScript and HTML.
            - **Script Editor Bug Fix**:
              - Fixed the bug where the userscript creation page displayed 3 stacked duplicate code editor boxes.
              - Migrated userscript creation and editing to the unified, robust Monaco Editor.
            - **Default Demo Userscript (Clean Novel Reader)**:
              - Automatically seeds an out-of-the-box userscript: *Clean Novel Reader (Ad & Clutter Remover)*.
              - Declutters web novel pages by removing floating ads, sticky banners, and sidebars before reading or TTS.
            - **Browser Next Chapter Mouse Icon**:
              - Updated the in-browser Next Chapter action button to a computer mouse icon (`Icons.Default.Mouse`).
            - **Streamlined Toolbar Progress**:
              - Both the in-app Reader top bar and the notification quick reading toolbar now strictly display clean `currentchap/total` progress (e.g. `12/85`) without redundant novel and chapter title clutter.
            - **Universal Drawer Navigation**:
              - Replaced back arrows in General Settings, About, Toolbar Settings, and Developer Logs with the Library Drawer burger menu (`Icons.Default.Menu`) to allow seamless navigation across books and tabs from any screen.

            **Download and install `app-release.apk` or `update-latest.apk` below:**
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/release/update-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
