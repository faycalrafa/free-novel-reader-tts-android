name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Determine Release Tag
        id: tag_version
        run: |
          DATE_TAG="v2.0.1"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android-app
        env:
          APP_VERSION_NAME: "2.0.1"
        run: ./gradlew assembleRelease -PappVersionName=2.0.1 --no-daemon

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NovelArrow Reader v2.0.1 (Stable)
          prerelease: false
          body: |
            ### NovelArrow Reader v2.0.1 (Stable) 📖🚀

            **NovelArrow Reader v2.0.1** brings singular chapter deletion and playlist reordering, ultra-fast batched directory scanning, duplicate download prevention (no duplicate files or `(1)` renames), full system notification & lock screen media controls synchronization for both local reader and browser modes, and disabled edge-swipe gestures during browser vertical scrolling.

            **100% Free and Open Source Software (FOSS)**

            #### Features in this release:
            - **Embedded Web Browser with Tabs**: Multi-tab browsing directly integrated into the library sidebar drawer.
            - **Full Page & Batch Downloads**: Offline snapshot capture matching the userscript (inlined stylesheets, base64 images, standalone next button `#na-floating-next`).
            - **Live Browser TTS Reader**: Interactive reading aloud with continuous sentence/paragraph navigation; webpage buttons and links remain fully clickable.
            - **Robust Content Extraction**: Fallback to first readable `<p>` when aggressive filters match no text.
            - **Library Sidebar Redesign**: Folder refresh button next to folder picker, and deletion confirmation popup with optional file deletion checkbox (unchecked by default).
            - **Synchronized Playback Controls**: Unified media notification and lockscreen/earbuds playback controls between offline reader and browser.
            - Automated Release APK build from branch `${{ github.ref_name }}` (`${{ github.sha }}`).

            **Download and install `app-release.apk` below:**
          files: android-app/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
