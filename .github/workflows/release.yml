name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Determine Release Tag
        id: tag_version
        run: |
          DATE_TAG="v2.4.3"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android-app
        env:
          APP_VERSION_NAME: "2.4.3"
        run: ./gradlew assembleRelease -PappVersionName=2.4.3 --no-daemon

      - name: Prepare APK Assets
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk android-app/app/build/outputs/apk/release/update-latest.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NovelArrow Reader v2.4.3 (Stable)
          prerelease: false
          body: |
            ### NovelArrow Reader v2.4.3 (Stable) 📖✨

            **NovelArrow Reader v2.4.3** fixes the `BadForegroundServiceNotificationException` startup crash by removing unsupported view tags from RemoteViews, introduces local pre-inflation validation in the foreground service, and adds automated XML layout regression testing.

            **100% Free and Open Source Software (FOSS)**

            #### Changes in this release:
            - **Fix RemoteViews Inflation Crash**: Replaced unsupported plain `android.view.View` tags in `notification_quick_toolbar_expanded.xml` with `@RemoteView`-annotated `<FrameLayout>` elements, resolving `InflateException` on status bar notification inflation.
            - **Defensive In-Process Pre-Inflation Check**: Added local pre-inflation sanity testing inside `QuickToolbarForegroundService` with automatic safe fallback to standard notifications if layout inflation ever fails, guaranteeing the app never crashes from notification IPC.
            - **Automated RemoteViews Allowlist Test**: Added `RemoteViewsValidationTest` to ensure that all layout files used in notifications strictly contain `@RemoteView` allowlist widgets.
            - **Persistent Foreground Service for Toolbar**: Ensures reading toolbar stays alive and easily accessible in notification shade across Android 12–15+.

            **Download and install `app-release.apk` or `update-latest.apk` below:**
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/release/update-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
