name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Determine Release Tag
        id: tag_version
        run: |
          DATE_TAG="v2.4.4"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android-app
        env:
          APP_VERSION_NAME: "2.4.4"
        run: ./gradlew assembleRelease -PappVersionName=2.4.4 --no-daemon

      - name: Prepare APK Assets
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk android-app/app/build/outputs/apk/release/update-latest.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NovelArrow Reader v2.4.4 (Stable)
          prerelease: false
          body: |
            ### NovelArrow Reader v2.4.4 (Stable) 📖✨

            **NovelArrow Reader v2.4.4** fixes persistent notification toolbar visibility across modern Android versions (Android 14, 15, and 16) and OEM skins (OnePlus OxygenOS, ColorOS, Xiaomi MIUI) by promoting the notification channel to standard alert importance, ensuring clean layout fitting, and adding runtime notification diagnostics.

            **100% Free and Open Source Software (FOSS)**

            #### Changes in this release:
            - **Notification Channel Visibility Fix (Channel v4)**: Migrated toolbar notification to a fresh channel (`novel_quick_toolbar_channel_v4`) with `IMPORTANCE_DEFAULT`, `setSound(null, null)`, and `enableVibration(false)`. Prevents OnePlus/OxygenOS and modern Android from classifying the toolbar as "Silent" and hiding it from the status bar, shade, and lock screen.
            - **Clean Up Obsolete Channels**: Automatically prunes previous low-importance toolbar channels from system storage on service start.
            - **Notification Builder Attributes**: Added standard `setContentTitle()`, `setContentText()`, `CATEGORY_SERVICE`, and `PRIORITY_DEFAULT` to ensure complete metadata compatibility with Android 12–16 SystemUI templates and lock screen displays.
            - **Explicit Notification Dispatch**: Added explicit `notificationManager.notify()` alongside `startForeground()` to guarantee an immediate SystemUI layout pass.
            - **Layout Fitting Optimization**: Optimized `notification_quick_toolbar.xml` height to `wrap_content` with `minHeight="48dp"` and streamlined vertical padding, guaranteeing it fits within Android's `DecoratedCustomViewStyle` boundaries without vertical clipping.
            - **Enhanced Developer Logs Diagnostics**: Logs real-time notification permissions, channel importance level, and active posted notification IDs in Developer Logs (`About -> Developer & Diagnostic Logs`).

            **Download and install `app-release.apk` or `update-latest.apk` below:**
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/release/update-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
