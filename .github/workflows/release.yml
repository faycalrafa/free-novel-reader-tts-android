name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Determine Release Tag
        id: tag_version
        run: |
          DATE_TAG="v4.3.0"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android-app
        env:
          APP_VERSION_NAME: "4.3.0"
        run: ./gradlew assembleRelease -PappVersionName=4.3.0 --no-daemon

      - name: Prepare APK Assets
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk android-app/app/build/outputs/apk/release/update-latest.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: BookReader v4.3.0 (Stable)
          prerelease: false
          body: |
            ### BookReader v4.3.0 (Tab-Scoped Browsing History, Multi-Chapter Downloader Pro Integration & Blob Downloads) 📚🚀✨

            #### 📑 Tab-Scoped Browsing History
            - **Per-Tab Isolation**: Browsing history dialogs and history screens now display only visits associated with the active tab instead of mixing pages across tabs.
            - **Tab Cleanup**: Closing a tab automatically purges its associated history records. Clearing history within a tab only clears visits for that tab.

            #### ⚡ Multi-Chapter Downloader Pro Integration & Library Auto-Sync
            - **Integrated Script Control**: Clicking the `multi_download` action button in the browser navigation bar directly triggers the upgraded "Novel Multi-Chapter Downloader Pro" (v4.0.0) modal and execution loop.
            - **Structured Storage**: Downloaded chapters are saved into structured novel folders under `Downloads/NovelReader/<NovelTitle>/`.
            - **Automatic Library Sync**: When the download loop completes or is stopped, automatic folder synchronization is immediately triggered so the new novel folder instantly appears in the Library sidebar.

            #### 🛡️ Robust Blob & Data URI Download Handler
            - **Blob Interception & Bridge**: Fixed crashes when clicking `blob:` links by routing blob objects through a client-side JavaScript `fetch` and Base64 bridge rather than passing invalid URIs to Android's `DownloadManager`.
            - **Data URIs**: Direct decode and disk write for `data:` URI payloads.

            #### 🎨 UI Decluttering
            - **Library Sidebar**: Removed redundant downloads button from the library drawer sidebar for a cleaner navigation experience.

            #### 🔄 Seamless Browser TTS Resume Card
            - **Native Library Resume Integration**: Replaced the startup popup dialog with the Library screen's "CONTINUE READING" card. When the last playback session was Browser TTS (or when the library has no local novels), the card prompts you to resume your web novel directly.
            - **Full DOM HTML Caching**: Offline resumption now caches the complete page DOM (`document.documentElement.outerHTML`) instead of synthetic plain text. Resuming renders full styles, interactive elements, scripts, and functioning auto-next.

            #### 🎧 Context-Aware Page-Load TTS & Tab Isolation
            - **Active Session Requirement**: "Auto-start TTS on page load" only triggers if a TTS reading session was already actively playing. Browsing normally without pressing read-aloud will never start reading unexpectedly.
            - **Multi-Tab Isolation**: Switching pages in the active tab cleanly updates audio reading to the current page. Background tabs loading pages will never hijack or interrupt the active reading session.

            #### 📥 Pure JS Batch Downloader & Next Chapter Resolution
            - **Robust Candidate Resolution**: Rewrote candidate button selection to inspect all interactive elements and child links with strict negative filtering, rejecting container links to Home, TOC, Index, Catalog, Prev, or novel root pages.
            - **Preserved Novel IDs in URLs**: Optimized URL chapter incrementing to target only the last chapter number segment, preventing corruption of book/novel numeric IDs.
            - **Autonomous JS Loop**: Download execution logic runs autonomously client-side in pure JS, relying on Android native bridges solely for persistent chapter storage.

            #### 📂 Universal Download History Screen & Dedicated Folder Routing
            - **Universal Download History**: New screen accessible from Browser Top Bar, Overflow Menu, and Navigation Drawer displaying all downloaded items with real-time search, file size, timestamps, open action, and delete/clear.
            - **Dedicated Folder Routing**: Batch novel chapters are neatly saved into `Downloads/NovelReader/<NovelTitle>/`, while generic file downloads (e.g., PDFs from external websites) route directly to the standard `Downloads` root directory.


            #### ⚓ Docked Bottom Media Bar
            - **Flush Bottom Attachment**: Re-anchored the bottom media dock (`TtsDock`) so its surface background extends flush behind the system navigation bar, eliminating the floating transparent gap above Android system buttons/gestures.

            #### 📥 Overhauled Multi-Chapter Downloader Userscript (v3.0.0)
            - **Native Bridge Integration**: Replaced broken WebView Blob download triggers with direct native bridge integration via `BrowserBridge.saveDownloadedChapter` / `AndroidBridge.saveDownloadedChapter`, properly registering downloaded chapters in the user library and saving to disk.
            - **Clean Reading Mode HTML**: Scrapes and stores only clean filtered chapter text wrapped in lightweight styling (`#chapter-content`), matching Reading Mode without saving bloated or frozen pages.
            - **Automated Next-Chapter Navigation**: Features intelligent candidate selector resolution, button text matching, SPA navigation detection, and visual countdown timer between chapters.


            #### 🎨 Restored Original Reader TTS Dock
            - **Docked Bottom Sheet Design**: Restored the original full-width docked bottom bar (`TtsDock`) with rounded top corners, replacing the detached floating island card.
            - **Original Control Layout**: Restored top row with glowing heartbeat Active Filters indicator, Settings gear, and Close button; restored middle release-to-jump paragraph preview; restored bottom controls with Sleep Timer pill, Prev, circular gradient Play/Pause button (`#3B82F6` to `#8B5CF6`), Next, and Speed pill.

            #### 🎧 Cross-Screen Audio Playback Isolation
            - **Library Reader Protection**: Browser page finish hooks now check audio state and will never interrupt or auto-start reading when Library TTS playback is actively running.
            - **Preserved Browser Playback**: Toggling the Reader TTS dock no longer stops ongoing Browser audio playback; playback source only shifts when a chapter or playback command is explicitly triggered.

            #### 📱 Native Media Notification Progress & Scrubber Sync
            - **Preserved Silence Media Source**: Removed `exoPlayer.setMediaItem` without URI which previously wiped out ExoPlayer's `SilenceMediaSource`, eliminating player error states and unseekable timelines.
            - **Real-Time Notification Synchronization**: Connected paragraph navigation (`nextParagraph()`, `previousParagraph()`, `seekToParagraph()`, and `onParagraphChanged()`) directly to service state updates, ensuring the native lock screen / notification media scrubber tracks paragraph progress accurately.

            #### 📥 Multi-Page Batch Download Smoothing
            - **Direct Next-URL Routing**: Connected `setPreExtractedNextChapterUrl` from `WebContentExtractor` through `BrowserChapterExtractor`, allowing the batch downloader to transition directly via next-page URLs instead of falling back to delayed DOM selector clicks.

            #### 🗑️ Robust Folder & Chapter Deletion
            - **Accurate Web Novel Flags**: Ensured `isWebNovel = true` on downloaded chapters so disk deletion candidate paths are recognized and cleaned.
            - **Comprehensive Disk & Duplicate Purge**: Updated `deleteNovelFilesFromDisk` and `deleteSingleChapterFile` to clean primary files, fallback duplicates in app-specific storage, and MediaStore entries.
            - **Safe Archival on Library Removal**: Novels removed from library without deleting files on disk are safely moved into `NovelReader/archive/`, preventing automatic re-import during library refresh.
            - **Default Storage Deletion**: Defaulted deletion dialog checkboxes to delete files from device storage with clear, consistent wording.

            #### ⏸️ Browser TTS Pause & Resume UX
            - **Saved Paragraph Progress on Pause**: Browser paragraph index is saved immediately into `savedReadingPositions` on pause.
            - **Resilient Resume**: Returning from Settings or backgrounding the browser preserves the paused paragraph position rather than restarting from paragraph 0.

            #### 🛡️ App-Route Chapter Import (Permanent SAF Permission Fix)
            - **App-Private Storage Migration**: Folder imports copy chapter files directly into the app's internal sandbox (`context.filesDir/imported_novels/<novelTitle>/`).
            - **Zero SAF Permission Errors**: Chapters and novels point to local disk paths, eliminating `SecurityException: Permission Denial` from `ExternalStorageProvider` across Android 11+ and reboot cycles.
            - **Resilient Library Refreshing**: Local app-route novels refresh via fast standard file I/O. Revoked legacy SAF trees are caught gracefully without wiping user library data.

            #### ⚡ High-Impact Performance Optimizations
            - **Atomic Room Upserts with Diffing**: Replaced destructive `clearAllNovels()` and `clearAllChapters()` full table wipes with targeted `insertNovels` and `insertChapters` using Room diffing.
            - **Next-Chapter Pre-fetching & Memoization**: Background paragraph pre-parsing on `Dispatchers.IO` in `AudioPlaybackCoordinator` eliminates audio gaps and stutters during chapter transitions.
            - **Event Throttling in ViewModel**: Debounced high-frequency `libraryUpdateEvents` prevents full-library re-fetching during rapid reading and seeking.
            - **Fast Batched SAF Projections**: Consolidated SAF tree scanning under cursor query projections, removing slow `DocumentFile` multi-IPC Binder overhead.

            #### 🧹 Logic De-duplication & Clean Slate Architecture
            - **Consolidated Sorting & Deduplication**: Unified natural ordering, regex parsing, and progress reconciliation inside `NovelDeduplicator`.
            - **Centralized File Scheme Handling**: Created `FileSchemeUtils` and `ProgressDebouncer` for unified file checks and rate limiting.
            - **Ergonomic ChapterParser Helper**: Added `ChapterParser.parseWithSettings(...)` consolidating 19-parameter call sites.
            - **Dead Code Pruning**: Removed unwired `onSortChapters` callback and scoped localized composable state.
            - **Hardened Test Suite**: Configured main test dispatchers across coordinator test suites, resolving all test failures and bringing the suite to a 100% green pass.
            - **Clean Storage & Metadata Deletion**: Deleting from disk cleanly deletes SAF documents and local folders, including `.progress.json` metadata files.

            #### 🎙️ Eliminate Next-Chapter Triple-Read TTS Stutter
            - **Debounced Auto-Read Pipeline**: Replaced uncoordinated coroutine launches with a tracked, single-flight `pageAutoReadJob` in `BrowserViewModel`, cancelling any pending auto-read extraction whenever a new page starts or user triggers next/prev navigation.
            - **Decoupled Page Title Reception**: Separated `WebChromeClient.onReceivedTitle` from `onPageFinished`. Dynamic `<title>` tag evaluations no longer re-fire the full page finish pipeline, eliminating multi-stage race conditions during page loads.
            - **Eliminated Duplicate Reading Mode Invocations**: Streamlined `startLiveReadingInternal(forceStartAtBeginning = true)` to avoid duplicate extraction passes and redundant `enterReadingMode()` re-entries on auto-advance.
            - **Audio Coordinator Rapid Play Suppression**: Added rapid identical invocation suppression in `AudioPlaybackCoordinator.playBrowserParagraphs()` to safeguard against duplicate paragraph 0 playback calls arriving within < 400ms.

            #### 🎙️ Web Browser Reading Mode TTS Synchronization Fix
            - **Short Paragraph Merging Synchronization**: Fixed paragraph index and audio desynchronization where short paragraphs ($\le 10$ words) were merged in the audio coordinator while remaining separate in `BrowserReaderView`.
            - **Unified Paragraph Numbering**: Constituent short paragraphs and their following paragraph are now unified under the same paragraph number across UI, dock counters, and TTS playback.
            - **Preserved Dialogue Formatting**: Maintained paragraph breaks (`\n\n`) within merged paragraphs so dialogue formatting remains clear and legible in reader mode and local reader views.
            - **Accurate Web Click-to-Seek**: Added DOM source index resolution via `seekToWebParagraph` ensuring web element taps cleanly map to their parent merged paragraph.

            #### 🗄️ AndroidX Room SQLite Migration & WAL Architecture
            - **Room Database Ingestion**: Fully migrated persistent novel library from monolithic JSON to AndroidX Room SQLite with Write-Ahead Logging (WAL) and foreign-key cascade semantics.
            - **Zero Data Loss Migrator**: Implemented `DatabaseMigrator` automatically converting legacy `novel_library_v1.json` into Room on first launch with backup preservation (`.bak`).
            - **Debounced Instant Writes**: Chapter and paragraph progress updates execute atomically in < 1ms via Room DAOs, decoupling heavy disk writes from TTS paragraph ticks.
            - **JSON Backup / Restore Preservation**: Retained JSON exclusively for user-facing import, export, and cross-device sync.

            #### 🎙️ Web Browser TTS 1:1 Synchronization & Visible Paragraph Numbers
            - **1:1 Text-to-Speech Truth**: Made visible reader text the single source of truth for browser TTS, removing uneven paragraph merging that caused desynchronization near the end of chapters.
            - **Paragraph Index Numbering**: Added clear, small paragraph numbers to the left of each paragraph in the browser reader view.
            - **Dynamic Dock Status**: `TtsDock` displays accurate paragraph index and total counts matching on-screen numbered paragraphs.
            - **Tap to Speak from Paragraph**: Tapping any numbered paragraph immediately begins TTS reading specifically from that exact sentence.

            #### 📜 Scroll-to-Bottom & Auto-Next Decoupling
            - **Decoupled Scroll Triggers**: Scrolling to the bottom of the chapter reader view will only advance the chapter if `autoClickOnScroll` is explicitly enabled in settings.
            - **Finished Reading Auto-Next**: Auto-advance on finished reading is governed exclusively by `autoReadNextChapter` when the final paragraph finishes playing.

            #### 🛡️ Resilient Rules & Diagnostic Logging
            - **Hardened Regex & Selectors**: Pronunciation and skip replacements now quote regex symbols to eliminate exceptions on special characters, with comprehensive `AppLogger` diagnostic capture.

            #### 🔄 Chapter & TTS Audio Sync Fixes (Book Reader)
            - **Eliminated Double Paragraph Pre-Merging**: Fixed an audio-text drifting bug where both `ReaderViewModel` and `AudioPlaybackCoordinator` applied paragraph bundling independently, causing paragraph count mismatch and visual highlighting desync.
            - **Progress Preservation on Chapter Transitions**: Resolved chapter auto-advance race condition where `ReaderViewModel.loadChapterContent()` reset progress to paragraph 0 when auto-advancing, even though TTS playback was actively speaking.
            - **Filter & Symbol Parameter Propagation**: Ensured `ignoredSelectors` and `skipWordsIgnoreSymbols` settings are consistently passed into coordinator chapter advance logic.

            #### 🛡️ `na-tts-highlight` Filter Bug Resolution
            - **Root Cause Fix**: `.na-tts-highlight` is the CSS class injected by `WebScriptInjector` to highlight currently speaking paragraphs in the browser. It was mistakenly added to default ignored selectors, causing TTS active paragraphs to be treated as unwanted ads/filters.
            - **Purged Filter**: Completely removed `.na-tts-highlight` from default ignored selectors across `Models.kt`, `WebContentExtractor.kt`, and `UserscriptRepository.kt`.

            #### 📖 Browser & Downloader First-Paragraph Bug Fix
            - **CSS Content Container Evaluated First**: Updated content extraction logic in both the live browser script (`WebContentExtractor.kt`) and batch downloader parser (`ChapterParser.kt`) to always resolve the CSS content container selector first before filtering.
            - **Container-Bounded Filtering**: Bound `isIgnored(el)` strictly within the content container element, preventing outer page structures (headers, navbars, sidebars) from inadvertently filtering story text.
            - **Inline Navigation Button Stripping**: First story paragraphs containing inline prev/next buttons are now safely cleaned by stripping button/link tags while fully preserving the story text, eliminating the bug where extraction always skipped to the second paragraph.
            - **URL-Scoped Downloader Rules**: Web novel batch chapter downloader now honors domain/URL-pattern-scoped content selectors.

            **BookReader v3.14.0** brings essential background playback continuity, a responsive native Monaco search experience, full browsing history, centered multi-chapter download progress, language detection accuracy improvements, and short paragraph synthesis merging:

            #### Key Updates:
            - **Background Next Chapter Auto-Advance in Browser**:
              - Introduced `BackgroundAwareWebView` preventing Chromium from pausing JavaScript execution and timers when the app is placed in the background during active live reading.
              - Pre-extracts next chapter navigation URL during content extraction and falls back to direct URL navigation if background DOM click dispatching is deferred by the WebView engine.
            - **Monaco Code Editor Native Search & Replace Toolbar**:
              - Replaced Monaco's desktop HTML find widget with a native Jetpack Compose Search & Replace toolbar.
              - Completely eliminates IME software keyboard fighting and touch latency when searching or replacing code in "View Raw HTML" and Userscript editors.
              - Includes match count (`cur/total`), case sensitivity toggle (`Aa`), Next/Previous navigation, single Replace, and Replace All.
            - **Browser Browsing History**:
              - Added comprehensive browsing history tracking powered by `BrowserHistoryRepository` with atomic writes (`AtomicFile`) and mutex synchronization.
              - Accessible via "Browsing History" in the browser's 3-dot overflow menu.
              - Features real-time search, timestamps, single-entry deletion, and complete history clearing.
            - **Centered Multi-Chapter Download Progress Card**:
              - Updated batch chapter downloader progress indicator to be prominently displayed in the middle of the screen with a darkened backdrop scrim, linear progress bar, chapter counter, and responsive stop button.
            - **Language Detection & False-Positive French Fix**:
              - Resolved false-positive French language detection on English text caused by homographic words (`son`, `car`, `ton`, `or`, `de`, `par`, `mon`, etc.).
              - Strengthened English stop-word weighting and minimum token thresholds in `LanguageDetectionEngine`.
            - **Short Paragraph TTS Merging (<= 10 words)**:
              - Short paragraphs with 10 words or fewer are automatically merged forward into the succeeding paragraph.
              - Prevents stutter, unnatural pauses, and Android TTS synthesizer failures on tiny isolated text fragments.

            #### Key Updates:
            - **Userscript Item Squishing Fixed**: Resolved version badge horizontal squishing in Userscript Bottom Sheet and Manager Dialog using `FlowRow` and `softWrap = false`.
            - **Userscript Naming & Renaming**: Users can name and rename scripts via `// @name` in Monaco or via the dedicated "Rename" action in Userscript Manager and Monaco editor header.
            - **Monaco Code Editor Direct Typing on Mobile**: Full Android touch focus and IME soft-keyboard support enabled so users can tap and write code directly in Monaco.
            - **Browser Automation Defaults Updated**:
              - *Auto-load next page on scroll to bottom* is now default **OFF**.
              - *Auto-load next page on finished reading last paragraph* is now added and default **ON**.
            - **Standalone Pure JS Multi-Download Userscript**: Refactored the batch chapter downloader into a pure JavaScript extension featuring an in-page modal dialog (Novel Name, Starting Chapter #, Chapters Quantity, Delay Between Chapters), filtered clean text extraction (matching Reading Mode), and automated chapter navigation loop. The old native download dialog has been removed.
            - **Live Resume Tracking**: Audio playback coordinator now persists progress in real-time on chapter start, seek, and pause, ensuring the Home screen Resume card immediately reflects the exact chapter.
            - **Notification Media Player Artwork**:
              - Notification and MediaSession now feature high-resolution artwork replacing procedural canvas book cover.
            - **Multi-Tab Reboot Persistence**:
              - Open browser tabs and active tab selection persist seamlessly across app restarts and device reboots.
            - **Interactive Scrubbable Slider in TopBar**:
              - Quick scrubbable slider under paragraph progress in both Reader and Browser top bars for smooth in-chapter navigation.
            - **Long-Press Auto-Clicker Target & Multi-Rule Next Selectors**:
              - Long-press any link or button in the browser to instantly bind it as a site-specific next chapter auto-clicker.
              - Upgraded Next Chapter Selectors to a multi-rule system with domain scoping, presets, and toggle switches.
            - **Filter & Rules Diagnostic Engine**:
              - Real-time tracking of filtered character counts across skip words, pronunciation rules, header/footer skips, and CSS element isolations.
              - Slide-up bottom sheet handle appears when rules are active, sorting rules by highest to lowest character impact.
              - Empty text protection: flashes handle red and displays alert toast if misconfigured rules filter out all playable text.
            - **Reading Mode Content Isolation**:
              - Reading mode respects matched content container selectors and isolates the novel body text cleanly.
            - **Ignored Elements Selector in Quick Audio Settings**:
              - Ignored CSS element selectors now directly accessible in Unified Audio Settings for both local library files and web reading.
            - **Page Clickables Inspector & Domain Navbar Shortcuts**:
              - Inspect all clickable elements on the current web page in DOM order with full-text search.
              - Pin discovered buttons as domain-specific shortcut buttons directly into the browser navbar.
            - **Streamlined Browser Navbar**:
              - Clean primary bar with responsive 3-dot overflow menu for secondary tools, automatically adapting to small screens.
              - Intuitive language tabs (English, Arabic, French), search, voice preview, and system engine launcher right at your fingertips.
            - **Return-to-Source Back Navigation**:
              - Navigating to any settings sub-screen (Voice Engine, Pronunciation Rules, Skip Words, Header/Footer Skips, Content Selectors, Ignored Selectors, Next Selector, Hardware Buttons) from Reader, Browser, Audio Studio, or Settings now remembers the originating screen and returns you right where you left off.
            - **In-App Hardware Volume Button Shortcuts**:
              - Removed background accessibility service requirements.
              - Physical volume buttons trigger gestures (single, double, long press) with tactile haptic feedback while actively reading in the app.
            - **Monaco Code Editor 2-Tier Header**:
              - Restructured editor dialog into two dedicated tiers: Top bar for novel chapter/script title, language badge, save, and close controls; second tier with horizontally scrollable action buttons (Select All, Cut, Copy, Paste, Search, Match Replace, Beautify/Format, Word Wrap).
            - **Audio Studio Quick Settings Integration**:
              - Added quick navigation callbacks into Unified Audio Settings from the Audio Studio MP3 view.
            - **ExoPlayer Thread Violation Fix (`IllegalStateException`)**:
              - Resolved thread enforcement crashes (`Player is accessed on the wrong thread`) caused when local neural TTS dispatched paragraph callbacks on background worker threads.
              - Thread-isolated all ExoPlayer queries and service status synchronizations strictly to `Dispatchers.Main` / main Android Looper.
            - **Runaway Chapter Skipping Prevention**:
              - Added defensive consecutive error tracking (`>= 3`) to immediately pause and notify the user instead of rapidly cycling and skipping through novel chapters.
              - Isolated UI and foreground service callbacks in `LocalTtsEngine` so notification failures never terminate active audio streams.
            - **KittenTTS & Kokoro Native Companion Integration (`voices.bin` & `tokens.txt`)**:
              - Fixed `Invalid OfflineTtsConfig` C++ initialization errors by switching KittenTTS to official `csukuangfj/kitten-nano-en-v0_1-fp16` and Kokoro to `csukuangfj/kokoro-int8-multi-lang-v1_0`.
              - Upgraded `NeuralModelDownloader` to verify and download required companion files (`voices.bin`, `tokens.txt`, and `lexicon-us-en.txt`).
              - Added speaker ID mapping across all 8 Kitten voices (Jasper, Bella, Bruno, Luna, Hugo, Rosie, Leo, Kiki) and Kokoro voices with native speaker index validation.
            - **Native Pre-flight Verification & Near Logging**:
              - Added file existence, non-empty checks, and detailed `AppLogger` near logging before native `OfflineTts` JNI allocations to guarantee zero silent crashes.
            - **TTS Voice Engine Screen Redesign**:
              - Cleaned up the cluttered interface: eliminated redundant "Installed engines on device" radio list.
              - Streamlined primary engines into two clear options: Built-in Android TTS vs. Embedded Neural TTS.
              - Displayed Piper, Kokoro, and KittenTTS models as "Embedded • Ready" with clear on-device status badges.
            - **Unified Multi-Engine Offline Neural TTS**:
              - Added native multi-engine configuration support for Piper (VITS), Kokoro, and KittenTTS via embedded `sherpa-onnx`.
              - Removed false external APK warnings from `OfflineEngineVoiceScreen` across all neural engine families.
              - Unified test voice synthesis and playback routing directly through `AudioPlaybackCoordinator` and `LocalTtsEngine`.
            - **Native Playback Crash Resolution (SIGABRT Fix)**:
              - Fixed native C++ aborts caused by missing ONNX metadata (`sample_rate`) by updating Piper download URLs to official `csukuangfj` Sherpa-ONNX pre-converted repositories.
              - Added multi-layer pre-flight model validation in `LocalTtsEngine` before initializing JNI pointers, preventing native crashes.
            - **Full Root Folder Re-scanning on Refresh**:
              - Fixed the bug where folder refresh ignored newly added subfolders and new files.
              - Re-scans all linked root directories during refresh to discover new subfolder novels and newly dropped files.
              - Automatically reloads chapters and active chapter pointers in `ReaderViewModel` so new files appear in the UI immediately without app restart.
              - Added rich near-logging via `AppLogger` across `.progress.json` reads, writes, and directory reconciliation.
            - **Lifecycle-Aware Auto & Manual Refresh**:
              - Automatic background library refresh upon app resume (`ON_RESUME`) with intelligent debouncing.
              - Manual "Refresh Folders" triggers an end-to-end scan across all linked directories and downloaded web novels.
            - **Integrated Offline On-Device Neural TTS (`sherpa-onnx`)**:
              - High-quality, zero-latency local speech synthesis using pre-trained VITS/Piper models (such as `vits-piper-en_US-lessac-medium`).
              - 64-bit native hardware acceleration targeting `arm64-v8a` and `x86_64` with bundled ONNX Runtime and JNI bindings.
              - Thread-safe `LocalTtsEngine` wrapping `OfflineTts` with coroutine isolation (`Dispatchers.Default`) and cancellation safety.
              - Direct PCM float streaming via Android `AudioTrack` with dynamic chunking and sample-rate matching.
              - `AudioData` encapsulation supporting normalized float samples, 16-bit PCM conversion, little-endian byte buffers, and WAV file export.
              - Automated recursive asset extractor for nested phoneme data (`espeak-ng-data`) supporting direct POSIX filesystem access on internal storage.
              - Configured `androidResources.noCompress` for `.onnx`, `.ort`, and `.bin` model files to optimize memory mapping and load times.
            - **Complete BookReader App Rebranding**:
              - Updated all in-app mentions, headers, settings, notifications, toasts, and logs from NovelArrow to **BookReader** (keeping package name `com.novelarrow.reader` consistent).
              - Replaced `Theme.NovelArrowReader` with `Theme.BookReader` and updated Compose themes to `BookReaderTheme`.
              - Upgraded userscript paths and storage to `Downloads/BookReader_Scripts` with automatic migration for existing user scripts.
              - Updated accessibility service to `BookReaderAccessibilityService` with full backwards compatibility for existing system settings.
            - **Adaptive Launcher Icon Fix (Rich 3D Claymorphic Terracotta)**:
              - Resolved the double-border "rounded inside square" issue where modern Android systems (Android 8.0+ / Android 16) rendered a flat cream square with a circular emblem instead of the terracotta icon.
              - Upgraded `ic_launcher_background.xml` to a rich terracotta lighting gradient matching the 3D claymorphic cushion.
              - Bound `android:roundIcon` to `@mipmap/ic_launcher_round` with circular terracotta assets across all screen densities.
              - Whether your launcher masks icons as a square, squircle, pebble, or circle, the icon fills its bounds with high-fidelity terracotta styling and crisp safe-zone book artwork.
            - **Dynamic Speech Engine Switching & Device Discovery**:
              - Query all installed Android TTS engines on the device (`com.google.android.tts`, `rhasspy.piper`, `com.k2fsa.sherpa.onnx.tts`, `com.samsung.SMT`, etc.).
              - Switch active TTS engines on the fly with 1-tap in `VoiceEngineScreen` without needing app restarts.
              - Persist selected engine package in `SettingsRepository` across sessions.
            - **Honest Neural Voice Testing & Routing**:
              - Resolved misleading previews where Google TTS secretly substituted arbitrary voices for Piper models.
              - `VoiceSynthesisTestCard` displays the active engine name and warns immediately if the active engine cannot synthesize raw ONNX models.
              - Auto-switch to installed Piper/Sherpa engines when saving an offline voice model.
            - **Engine Readiness & Compatibility Badges**:
              - Added "Engine Ready" vs "Engine Required" status badges on Piper, Kokoro, and KittenTTS cards.
              - Direct 1-tap download and installation links for open-source Piper TTS and Sherpa-ONNX APKs.
            - **Direct Share Sheet for Small Chapter & Paragraph Audio**:
              - Automatically launches the native Android share view (`Intent.ACTION_SEND` chooser) directly on the screen as soon as fast WAV generation completes.
              - Eliminates unnecessary navigation to the Audio Studio or pulling down the notification shade for quick shares.
            - **Multi-Chapter Batch Downloader False-Duplicate Fix**:
              - Enhanced `DomContentVerifier` with multi-point structural chapter fingerprinting (`createChapterFingerprint`), inspecting middle and end paragraphs.
              - Pages sharing static novel title headers (`<h1>Book Title</h1>`) are no longer falsely flagged as duplicates once URL transition is confirmed.
              - Automatic chapter title resolution ensures clean naming (`Novel Title Chapter N`) instead of repetitive book title prefixes.
            - **In-App Offline Voice Engine Testing & Diagnostics**:
              - Added dedicated "TEST VOICE SYNTHESIS" card in `OfflineEngineVoiceScreen` with an editable text input and play/stop test button.
              - Audible voice previews using selected voice or best matching voice with proactive notifications.
              - Explicit user toasts and warning logs (`AppLogger.w`) when an offline voice is not registered in the active system TTS engine, preventing silent default fallbacks.
            - **Persistent Neural Models Across App Updates**:
              - Models are stored in persistent external app storage with legacy filename alias scanning. Never re-download existing models after updating!
              - Resolved voice-not-found warnings when selecting neural voices.
            - **Multi-Chapter Batch Downloader Stalling Fix**:
              - Prioritized URL and navigation transition detection to eliminate stalls during cross-chapter scraping.
            - **Adaptive FlowRow Layouts**:
              - Resolved button and chip vertical overflow on narrow screens.
            - **Library Refresh Archive Isolation & New Chapter Discovery**:
              - Refresh now exclusively rescans active visible folders and detects newly added chapters, never touching or resurrecting archived novels.
            - **Quick Dev Logs Shortcut & Browser Settings Reorganization**:
              - Direct Dev Logs button in the navigation drawer next to About.
              - Reorganized browser settings with Selectors & Extraction first styled like quick TTS settings.

            #### Key Updates in this release:
            - **Custom Neural Model Import & Engine Upgrades**:
              - Users can now import custom ONNX models and JSON configs/tokens with automatic header validation and optional data directory support (e.g. espeak-ng-data).
              - Added all 8 KittenTTS Micro 0.8 voices (Bella, Jasper, Luna, Bruno, Rosie, Hugo, Kiki, Leo) via HuggingFace.
              - Fixed Piper TTS sample preview audio URLs (HTTP 200 via GitHub Pages).
              - Explicit voice activation toast notifications when a voice fails or is missing, preventing silent default fallbacks.
            - **Monaco Code Editor Clipboard Actions**:
              - Added dedicated toolbar buttons for Select All, Copy, Cut, and Paste interfacing directly with Android's system `ClipboardManager` and Monaco's editor API.
            - **Reading Filters Persistence & Live Re-Parsing**:
              - Eliminated settings backup overwrite loops and ensured in-memory cache coherency across repositories.
              - Live re-parsing of active chapter paragraphs upon pronunciation rule or skip word changes without requiring app restart.
            - **Library Folder Refresh & Non-Interfering Browsing**:
              - Preserved `isArchived` status across library rescans and isolated nested volume subfolders.
              - Inspecting different folders in the library drawer no longer interrupts or stops ongoing audio playback.
            - **Audio Studio Folder Playlist Navigation**:
              - Previous/Next track controls now advance through all audio tracks within the active novel folder.
            - **Quick Toolbar Notification Progress**:
              - Displays paragraph progress percentage (`• ¶ $curPara/$totalParas ($pct%)`) alongside chapter numbers in notification and toolbar.
            - **Browser Settings Subroutes & Single-View Dialog**:
              - Replaced tabbed browser dialog with single-view layout and dedicated subroutes for Next Chapter Selectors and Ignored Element Selectors.
            - **Dedicated Offline Neural Voice Routes (Piper, Kokoro, KittenTTS)**:
              - Dedicated settings routes for Piper TTS, Kokoro 82M (sherpa-onnx), and KittenTTS with on-device model management.
              - Download prompt cards with real-time download progress, background cancellation, and disk status.
              - Curated Hugging Face ONNX models: lightweight single voices (<80MB) and multi-voice packages (<350MB).
              - Language filtering showing only supported languages per engine (EN, FR, AR for Piper; EN, FR for Kokoro; EN for KittenTTS).
              - Sample audio preview with animated visualizer pulse and TopAppBar Save button to activate as the app default voice.
            - **Settings Sub-Routes Search Standardization**:
              - Replaced all in-body search boxes with the sleek in-TopAppBar search design from the voice engine route.
              - Applied to Pronunciation Rules, Skip Words, Content Selectors, and Header/Footer Skips screens with clear buttons and hardware back navigation.
            - **Audio Studio Library Accordion & Track Management**:
              - Per-folder accordion view where tapping a novel folder expands its tracks and automatically collapses others.
              - Inline long-press actions on tracks: instant audio sharing via FileProvider and track deletion with automatic library refresh.
              - Generation redirect: starting MP3 generation automatically routes to the Audio Studio Library view with live progress tracking.
              - Chapters and playlists organized neatly into their respective novel subfolders (`Downloads/BookReader/<NovelTitle>/`).
            - **Batch Chapter Download Race Condition Fix**:
              - Resolved download stalling on fast web novel chapter transitions by bypassing redundant URL equality checks once DOM transition is verified.
            - **TTS Voice Retention & ExoPlayer Thread Safety**:
              - Fixed voice selection resetting to system default when reading chapters.
              - Added authentic Arabic sample phrase for TTS voice preview.
              - Switched audio file progress ticker to Main dispatcher, eliminating ExoPlayer thread access crashes.
            - **Custom Claymorphic Loading Animation**:
              - Replaced all circular progress spinners across the app with the custom looping claymorphic book & pulsating audio waveform animation.
              - Super-smooth transparent animated WebP (`app_loading_animation.webp`) with graceful pulsing brand fallback on legacy Android versions.
              - Standardized `AppLoadingIndicator` composable across reader, browser, audio studio, archive, and diagnostics screens.
            - **Default Squircle App Launcher Icon**:
              - Set the 3D terracotta cushion squircle icon as default app launcher icon across all densities and Android launchers (`roundIcon`).
              - Upgraded Play Store icon asset (`playstore-icon.png`) to the 512x512 3D squircle cushion.
              - Preserved authentic circular 3D icon (`ic_app_icon_round.webp`) for in-app screens (About hero card, onboarding, home empty state).
            - **Audio Studio & Bottom Media Dock (`TtsDock`) Seeking**:
              - Audio studio mode now displays position and duration in seconds (`mm:ss / mm:ss`).
              - Interactive audio scrubbing and slider seeking like a dedicated music player.
              - Studio audio folders organized hierarchically based on their parent novel folder in the library.
              - Added Close button (`X`) to stop ongoing playback and dismiss the media dock.
              - Updated settings icon to a sleek gear symbol.
            - **Voice Engine & Multilingual Voice Management**:
              - Restricts voice options cleanly to English, Arabic, and French across TTS engines.
              - Multi-tab favorite voice selection per language with auto-detection during playback.
              - Fixed Android TTS voice assignment bug where female voices reverted to male default.
              - Authentic language preview phrases for Arabic, French, and English.
              - Animated TopAppBar Save button when pending voice changes exist.
              - Added engine selection cards for Built-in Android TTS, Piper TTS, Kokoro (sherpa-onnx), and KittenTTS.
            - **Browser Batch Download Reliability**:
              - Eliminated chapter skipping/jumping and double-next click races via debounced navigation state guards.
              - Verified URL and DOM transitions before triggering chapter downloads.
            - **Dedicated Settings Routes**:
              - **CSS Content Selectors Screen**: Full-screen CRUD with priority ordering, master toggle, and site/folder scope filters.
              - **Header & Footer Skips Screen**: Full-screen tabbed interface with master switches and exact-match filters.
              - Quick settings dialog streamlined to 1-tap navigation buttons directly into full routes.
              - Moved "Clear All Library and Progress" to the bottom of Settings with confirmation modal.
            - **Boot Flow Improvement**:
              - App boots into the Home screen (`EmptyState`) with the "CONTINUE READING" quick-play card instead of forcing the last chapter directly into the reader.

            **BookReader v3.2.0** is a comprehensive UX overhaul: dedicated settings routes, voice engine & selection screens, audio studio library with granular MP3 generation progress, smarter web downloads, and branding refinements.

            #### Key Updates in this release:

            - **Settings Architecture Overhaul (M1)**:
              - Deconstructed monolithic settings dialogs into dedicated navigation routes.
              - **Pronunciation Rules Screen**: dedicated route with individual active/inactive toggles, add/edit/delete flows, live test preview, and granular scope filtering (`GLOBAL`, `FOLDER`, `URL_PATTERN`).
              - **Skip Words Screen**: standalone route with responsive `FlowRow` wrapping dialogs.
              - All dialogs and button layouts adapt gracefully to narrow screens without squashing.

            - **Voice Engine & Selection Routes (M2)**:
              - Replaced TTS voice dropdown with a dedicated Voice Engine route.
              - Hierarchical voice picker organized neatly by language and locale.
              - Instant audio preview buttons next to each voice for sampling before selection.

            - **Audio Studio Library & Granular Progress (M3)**:
              - Audio section now defaults to a generated audio file/folder library view.
              - Top-right `+` button opens the Audio Generator workflow.
              - Tapping any audio file plays it immediately through the global persistent bottom media controller.
              - MP3 generation displays real-time granular progress: `Paragraph X / Total` and `Chapter Y / Total`.

            - **Web Multi-Download: Centered Progress & Content Change Detection (M4)**:
              - Centered download progress overlay with dark scrim, chapter counts, and cancel controls.
              - DOM content transition verification: waits for page content to actually change before scraping, preventing duplicate chapter captures.

            - **About Screen & Branding (M5)**:
              - App launcher icon displayed above the "BookReader" title on the About screen.
              - README reframed as a personal hobby project.

