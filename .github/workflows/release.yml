name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Determine Release Tag
        id: tag_version
        run: |
          DATE_TAG="v2.4.1"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android-app
        env:
          APP_VERSION_NAME: "2.4.1"
        run: ./gradlew assembleRelease -PappVersionName=2.4.1 --no-daemon

      - name: Prepare APK Assets
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk android-app/app/build/outputs/apk/release/update-latest.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NovelArrow Reader v2.4.1 (Stable)
          prerelease: false
          body: |
            ### NovelArrow Reader v2.4.1 (Stable) 📖✨

            **NovelArrow Reader v2.4.1** brings critical fixes for notification quick toolbar visibility, adds the sleep timer quick-control button, resolves the recurring restore data boot popup, and redesigns system dialogs for compact mobile screens.

            **100% Free and Open Source Software (FOSS)**

            #### Changes in this release:
            - **Quick Reading Toolbar Fix**: Resolved notification drawer & lockscreen invisibility caused by adaptive launcher icons and theme attributes. Now uses a dedicated monochrome status bar vector icon and default alert channel.
            - **Notification Sleep Timer**: Added a quick Sleep Timer pill (`btn_sleep_timer`) to the notification toolbar directly next to the reading speed changer, cycling through 0, 15, 30, 45, and 60 minutes on tap.
            - **Toolbar Customization Options**: Integrated sleep timer toggle and live mockup preview into Toolbar Settings.
            - **Restore Data Startup Fix**: Fixed the persistent "Restore Previous Data" dialog popping up on every boot; now persists user handling and only surfaces when unhandled backup data is detected.
            - **Small Screen Dialog Redesign**: Redesigned both the "Restore Previous Data" and "Update Available" dialogs with full-width vertically stacked action buttons to eliminate button clipping and horizontal overflow on narrow displays.
            - **Boot Toolbar Synchronization**: Automatically initializes and posts the pinned reading toolbar on application launch if enabled.

            **Download and install `app-release.apk` or `update-latest.apk` below:**
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/release/update-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
