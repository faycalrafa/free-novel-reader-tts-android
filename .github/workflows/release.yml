name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Determine Release Tag
        id: tag_version
        run: |
          DATE_TAG="v2.3.0"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android-app
        env:
          APP_VERSION_NAME: "2.3.0"
        run: ./gradlew assembleRelease -PappVersionName=2.3.0 --no-daemon

      - name: Prepare APK Assets
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk android-app/app/build/outputs/apk/release/update-latest.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NovelArrow Reader v2.3.0 (Stable)
          prerelease: false
          body: |
            ### NovelArrow Reader v2.3.0 (Stable) 📖✨

            **NovelArrow Reader v2.3.0 (Stable)** introduces a complete userscript and extension ecosystem for the integrated web browser, local file-backed script storage, an in-app CodeMirror JavaScript editor, GM_notification Toast support, and a comprehensive Markwon documentation center.

            **100% Free and Open Source Software (FOSS)**

            #### Features in this release:
            - **Userscript Manager & Local File Storage**: Raw JavaScript scripts are stored directly in public `Downloads/NovelArrow_Scripts/*.user.js` files, decoupling script code from the database.
            - **Extensions Entry Point (🧩 Dropdown)**: Top URL bar now features a dedicated Extensions icon opening a bottom sheet with active script toggles, manager, editor, and documentation shortcuts.
            - **Advanced CodeMirror Editor**: Embedded offline CodeMirror 5 editor with JavaScript syntax highlighting, line numbers, a top Save toolbar, and a mobile utility bar (Select All, Cut, Copy, Paste, Undo, Redo) docked above the keyboard.
            - **Greasemonkey GM_notification API**: Full polyfill for `GM_notification` displaying native Android Toast alerts from web userscripts.
            - **Full Documentation Center & Markdown Export**: In-app documentation rendered via Markwon with a ScrollView + TextView, and a "Copy as Markdown" action using Android's ClipboardManager.
            - **Auto Disk Sync**: Automatically detects and registers any `.user.js` files dropped into the `Downloads/NovelArrow_Scripts` directory.

            **Download and install `app-release.apk` or `update-latest.apk` below:**
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/release/update-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
