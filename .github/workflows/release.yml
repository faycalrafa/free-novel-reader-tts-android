name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Determine Release Tag
        id: tag_version
        run: |
          DATE_TAG="v2.5.0"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android-app
        env:
          APP_VERSION_NAME: "2.5.0"
        run: ./gradlew assembleRelease -PappVersionName=2.5.0 --no-daemon

      - name: Prepare APK Assets
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk android-app/app/build/outputs/apk/release/update-latest.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NovelArrow Reader v2.5.0 (Stable)
          prerelease: false
          body: |
            ### NovelArrow Reader v2.5.0 (Stable) 📖✨

            **NovelArrow Reader v2.5.0** delivers a complete visual and functional redesign of the persistent quick reading notification toolbar, adding sleek modern icons, prominent playback controls, live real-time sleep timer countdown, and space-optimized layout.

            **100% Free and Open Source Software (FOSS)**

            #### Changes in this release:
            - **Notification Toolbar Visual Redesign**:
              - Eliminated the double-border "card-inside-card" appearance by integrating seamlessly with Android's system notification container (`@android:color/transparent`).
              - Removed duplicate header icon inside the custom view to grant full horizontal space to novel title and chapter reading status.
              - Replaced legacy Gingerbread media icons with crisp Material 3 vector assets for Previous, Play/Pause, Next, and Site Next (`ic_toolbar_*`).
              - Added a prominent circular accent purple (`#7C3AED`) background for the Play/Pause button.
              - Redesigned speed and sleep timer badges into sleek dark slate (`#1E293B`) pills with `#334155` subtle borders.
            - **Live Sleep Timer Countdown**:
              - The notification toolbar sleep timer pill now actively counts down in real time (e.g. `⏱ 29:45`, `⏱ 14:02`, `⏱ 0:45`) synchronized with TTS playback.
              - Live updates dispatched via coroutine state flows in `QuickToolbarForegroundService`.
            - **Speed Formatter Fix**:
              - Fixed string formatting bug where speech rates like 1.75x were displayed as `"1.75xx"`.
            - **Settings Live Mockup Harmonization**:
              - Updated `ToolbarSettingsScreen` live mockup preview to perfectly mirror the new dark slate pills, purple circular play button, and slate icons.
            - **Unit Tests**:
              - Added comprehensive unit tests in `QuickToolbarFormattingTest` validating speed rate string formatting and live countdown timer conversion.

            **Download and install `app-release.apk` or `update-latest.apk` below:**
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/release/update-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
