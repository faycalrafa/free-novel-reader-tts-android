name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Determine Release Tag
        id: tag_version
        run: |
          DATE_TAG="v2.4.2"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android-app
        env:
          APP_VERSION_NAME: "2.4.2"
        run: ./gradlew assembleRelease -PappVersionName=2.4.2 --no-daemon

      - name: Prepare APK Assets
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk android-app/app/build/outputs/apk/release/update-latest.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NovelArrow Reader v2.4.2 (Stable)
          prerelease: false
          body: |
            ### NovelArrow Reader v2.4.2 (Stable) 📖✨

            **NovelArrow Reader v2.4.2** fixes persistent notification toolbar visibility across modern Android OS versions (Android 12–15+), introduces Foreground Service persistence, adds system-wide error catching with copyable diagnostics, and includes a real-time Developer Log viewer.

            **100% Free and Open Source Software (FOSS)**

            #### Changes in this release:
            - **Persistent Foreground Service for Toolbar**: Migrated the Quick Reading Toolbar to `QuickToolbarForegroundService` (`specialUse` type) with `FOREGROUND_SERVICE_IMMEDIATE` display, ensuring the toolbar stays alive and visible even when the app is backgrounded.
            - **Android 14+ Dismiss Rebound**: Added `deleteIntent` rebound mechanism that automatically restores the pinned reading toolbar if swiped away while enabled.
            - **SystemUI RemoteViews Fix**: Eliminated illegal `<Space>` tags and adaptive launcher icon references that triggered hidden `InflateException` crashes in the Android SystemUI shade.
            - **Global Error Dialog & Diagnostics**: Catches crashes and service failures globally and presents a clean alert modal with a one-tap "Copy Error Log" button and direct link to developer logs.
            - **In-App Developer Logs Viewer**: Added a dedicated Developer & Diagnostic Logs page under About (`About -> Developer & Diagnostic Logs`) showing rolling logs from the last 60 minutes with level filters (Error, Warn, Info, Debug), search bar, copy all, share, and system logcat dumping.
            - **System Permissions & Battery Diagnostic Card**: Added a dedicated card to Toolbar Settings with one-tap shortcuts to grant notification permissions and exempt the app from battery optimization sleep.

            **Download and install `app-release.apk` or `update-latest.apk` below:**
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/release/update-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
