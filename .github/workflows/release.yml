name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Determine Release Tag
        id: tag_version
        run: |
          DATE_TAG="v3.1.0"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Build Release APK
        working-directory: android-app
        env:
          APP_VERSION_NAME: "3.1.0"
        run: ./gradlew assembleRelease -PappVersionName=3.1.0 --no-daemon

      - name: Prepare APK Assets
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk android-app/app/build/outputs/apk/release/update-latest.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NovelArrow Reader v3.1.0 (Stable)
          prerelease: false
          body: |
            ### NovelArrow Reader v3.1.0 (Stable) 📖✨

            **NovelArrow Reader v3.1.0** introduces granular pronunciation scoping, dedicated rule & skip word management hubs, and atomic settings storage persistence!

            #### Key Updates in this release:
            - **Pronunciation Rules Scoping Engine**:
              - Support for `GLOBAL`, `FOLDER`, and `URL_PATTERN` scopes.
              - Match specific novel directories or web domains (e.g., `*wuxiaworld.com*`).
              - Individual active/inactive toggles for rules without having to delete them.
            - **Dedicated Pronunciation Rules & Auto Skip Words Screens**:
              - Clean top bars, search filters, and active rule counters.
              - Full-width responsive dialogs with `FlowRow` chips.
              - Intuitive add/edit/delete/toggle controls.
            - **Settings Hub Integration & FlowRow Dialogs**:
              - Direct navigation from Global Settings into dedicated management screens.
              - Quick links inside `UnifiedAudioSettingsDialog` to open full managers.
              - Multi-row wrapped preset chips and action buttons to prevent button squashing.
            - **Thread-Safe Atomic Persistence**:
              - Zero-corruption atomic disk writes via `AtomicFile` and Kotlin `Mutex`.
              - Near logging with `AppLogger` across all failure-prone sites.
            - **High-Fidelity 3D Claymorphic Launcher & Adaptive Icons**:
              - Master 3D tactile icon with an open book, acoustic equalizer waveform, and smooth depth shading.
              - Multi-density WebP mipmap coverage (`mdpi`, `hdpi`, `xhdpi`, `xxhdpi`, `xxxhdpi`).
              - Adaptive icon calibration for Google Pixel (circle), Samsung One UI (squircle), Xiaomi, and standard launchers.
              - High-resolution 512×512 Google Play Store asset included.
            - **About Screen Redesign & Chronological Changelog**:
              - Concise feature breakdown without current status labels.
              - Dedicated Version History screen detailing all architectural milestones from v3.0.0 down to v1.0.0.
            - **Quick Settings Tile**:
              - Added Quick Settings drawer tile (`BookReaderTileService`) to resume playback where you last left off.
            - **System Sharing Receiver**:
              - Share web links to BookReader with instant options: Open in Browser, Save Frozen HTML, or Audify to MP3.
              - Share plain text to BookReader to audify directly to MP3 with a reading speed selector.
            - **Library Folder & Chapter Sharing**:
              - Fuse novel folders into a single HTML (with styling and table of contents), TXT, or MD file.
              - Zip entire novel folders for seamless transfer.
              - Audify chapters/novels to MP3 with chapter range, split modes (by chapter, by minutes, or single file), and reading speed selector.
            - **Paragraph Multi-Selection**:
              - Select multiple paragraphs in Reader mode with a floating action bar to copy text or share as MP3 using current voice settings.
            - **Text-to-MP3 Studio**:
              - Dedicated studio screen located next to the Archive button in the drawer header with chapter range sliders and split controls.
            - **Background Export Service**:
              - Foreground service with persistent progress notification and cancel support; files > 1MB automatically saved to `Downloads/BookReader/`.

            **Download and install `app-release.apk` or `update-latest.apk` below:**
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/release/update-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
